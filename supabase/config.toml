project_id = "lastly"

# pg_cron 은 사용자 JWT 없이 별도 CRON_SECRET 으로 호출한다.
# 함수 안에서 Authorization 헤더를 검증한다.
[functions.dispatch-digests]
verify_jwt = false

# 브라우저의 OPTIONS 요청을 처리하고, 함수 안에서 사용자 JWT를 검증한다.
[functions.api]
verify_jwt = false

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.external.kakao]
enabled = true
client_id = "env(KAKAO_CLIENT_ID)"
secret = "env(KAKAO_CLIENT_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
